server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }
}

# Connection and request counters, read by the exporter.
# Port 8081 is not published in docker-compose.yml, so this is only
# reachable from other containers on the Docker network.
server {
    listen 8081;
    server_name _;

    access_log off;

    location = /stub_status {
        stub_status;
    }
}
