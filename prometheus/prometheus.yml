global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  # Nginx connection and request counters
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # Is the site reachable, and how fast does it answer?
  # Prometheus asks the blackbox exporter to request the target for it.
  - job_name: site-probe
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://web/"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
